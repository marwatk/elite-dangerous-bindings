<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Elite Dangerous Bindings</title>
    <meta
      name="description"
      content="View, edit and print Elite Dangerous control bindings in your browser. Bind by pressing the real button on your HOTAS."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1b1b1f" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&amp;family=Roboto:wght@300;400;500&amp;family=Roboto+Mono:wght@400;500&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=block"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint.
      try {
        var t = localStorage.getItem('edb.theme');
        if (t === 'light' || (!t && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.add('light');
        }
      } catch (e) {}
    </script>
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
