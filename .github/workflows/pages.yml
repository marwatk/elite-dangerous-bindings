name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Serve from https://<user>.github.io/<repo>/
      - run: npm run build -- --base-href "/${{ github.event.repository.name }}/"
      # SPA fallback: unknown paths load the app.
      - run: cp dist/elite-dangerous-bindings/browser/index.html dist/elite-dangerous-bindings/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/elite-dangerous-bindings/browser
      - id: deployment
        uses: actions/deploy-pages@v4
